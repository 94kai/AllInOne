<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>Allinone</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">A</span><span>allinone</span></div>
      <nav class="main-nav" aria-label="主要导航">
        <button class="nav-item active" data-view="home"><span data-icon="home"></span><span>概览</span></button>
        <button class="nav-item" data-view="files"><span data-icon="folder"></span><span>文件</span></button>
        <button class="nav-item" data-view="links"><span data-icon="compass"></span><span>导航</span></button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span id="host-status">正在连接</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow" id="date-label"></p><h1 id="page-title">晚上好</h1></div>
        <button class="icon-button" id="refresh-button" aria-label="刷新当前页面" title="刷新"><span data-icon="refresh"></span></button>
      </header>

      <section class="page active" id="home-view">
        <div class="hero-card">
          <div><p class="eyebrow light">YOUR PRIVATE CLOUD</p><h2>欢迎回来</h2><p>文件、服务和常用入口，都在这里。</p></div>
          <div class="hero-orbit"><div class="hero-core"><span data-icon="server"></span></div></div>
        </div>
        <div class="section-heading"><div><p class="eyebrow">系统状态</p><h2>此刻运行</h2></div><span class="section-note" id="monitor-note">进入页面时更新</span></div>
        <div class="metric-grid" id="metric-grid">
          <article class="metric-card"><div class="metric-icon blue"><span data-icon="cpu"></span></div><div><span>处理器</span><strong id="cpu-value">--</strong><small id="cpu-meta">按需采样</small></div></article>
          <article class="metric-card"><div class="metric-icon violet"><span data-icon="memory"></span></div><div><span id="memory-label">内存</span><strong id="memory-value">--</strong><small id="memory-meta">正在读取</small></div></article>
          <article class="metric-card wide"><div class="metric-icon coral"><span data-icon="database"></span></div><div class="disk-summary"><span>存储空间</span><strong id="disk-value">--</strong><small id="disk-meta">正在读取</small><div class="progress"><i id="disk-progress"></i></div></div></article>
        </div>
        <div class="section-heading"><div><p class="eyebrow">快速访问</p><h2>常用入口</h2></div><button class="text-button" data-view-target="links">管理导航 <span data-icon="arrow"></span></button></div>
        <div class="link-grid compact" id="home-links"></div>
      </section>

      <section class="page" id="files-view">
        <div class="file-toolbar">
          <label class="root-select"><span data-icon="database"></span><select id="root-select" aria-label="文件入口"></select><span data-icon="chevron"></span></label>
          <div class="view-actions">
            <button class="icon-button active" id="list-mode" aria-label="列表视图"><span data-icon="list"></span></button>
            <button class="icon-button" id="grid-mode" aria-label="网格视图"><span data-icon="grid"></span></button>
          </div>
        </div>
        <div class="favorite-shelf">
          <div class="favorite-title"><span data-icon="star"></span><span>收藏目录</span></div>
          <div class="favorite-list" id="favorite-list"></div>
          <button class="favorite-add" id="favorite-current"><span data-icon="plus"></span><span>收藏当前</span></button>
        </div>
        <div class="breadcrumbs" id="breadcrumbs" aria-label="当前路径"></div>
        <div class="file-meta"><span id="file-count">正在读取…</span><span class="muted" id="file-hint">只读模式</span></div>
        <div class="file-list" id="file-list"></div>
      </section>

      <section class="page" id="links-view">
        <div class="links-intro"><div><p class="eyebrow">SERVICE DIRECTORY</p><h2>地址导航</h2><p>把 NAS 服务、家庭设备和常用站点收进一个入口。</p></div><button class="primary-button" id="add-link"><span data-icon="plus"></span>添加地址</button></div>
        <div class="link-grid" id="link-grid"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="移动端导航">
      <button class="nav-item active" data-view="home"><span data-icon="home"></span><span>概览</span></button>
      <button class="nav-item" data-view="files"><span data-icon="folder"></span><span>文件</span></button>
      <button class="nav-item" data-view="links"><span data-icon="compass"></span><span>导航</span></button>
    </nav>
  </div>

  <div class="modal-backdrop" id="preview-modal" hidden>
    <section class="preview-panel" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <header><div><p class="eyebrow">文件预览</p><h2 id="preview-title">文件</h2></div><div class="preview-actions"><a class="icon-button" id="download-file" aria-label="下载文件"><span data-icon="download"></span></a><button class="icon-button" data-close="preview"><span data-icon="close"></span></button></div></header>
      <div class="preview-body" id="preview-body"></div>
      <footer id="preview-meta"></footer>
    </section>
  </div>

  <div class="modal-backdrop" id="link-modal" hidden>
    <form class="form-panel" id="link-form">
      <header><div><p class="eyebrow">QUICK ACCESS</p><h2 id="link-form-title">添加地址</h2></div><button type="button" class="icon-button" data-close="link"><span data-icon="close"></span></button></header>
      <input type="hidden" id="link-id">
      <label>名称<input id="link-title" maxlength="40" required placeholder="例如：家庭相册"></label>
      <label>地址<input id="link-url" type="url" required placeholder="https://photo.example.com"></label>
      <label>说明<input id="link-description" maxlength="80" placeholder="一句话描述这个服务"></label>
      <label>标识颜色<input id="link-color" type="color" value="#5b8def"></label>
      <div class="form-actions"><button type="button" class="secondary-button danger" id="delete-link" hidden>删除</button><span class="form-spacer"></span><button type="button" class="secondary-button" data-close="link">取消</button><button class="primary-button" type="submit">保存地址</button></div>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
